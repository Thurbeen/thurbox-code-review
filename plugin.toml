# The code-review plugin: thurbox's agent pane, with a Review tab beside Agent and
# Shell.
#
# This plugin is several files — the pane and the modules it requires — so it is
# installed by CLONING it:
#
#     thurbox-cli plugin install git+https://github.com/Thurbeen/thurbox-code-review
#
# The clone lands at `<interface dir>/thurbox-code-review/`, keeps its `.git` (so
# `update` is a fetch and your edits are protected), and `pane.source` below names
# the entry point inside it.
#
# The pane is a fork of the agent pane thurbox ships, and it REPLACES it: both are
# named `agent` and both occupy the `center` slot. `install` does not remove the
# bundled `plugins/20_agent.lua` — deleting (or turning off) that file is the
# README's install step 3, and `plugin check` then loads one `agent`.
#
# The modules are NOT listed as `[[module]]`. That list is for the file-by-file
# delivery path, which copies each file to a destination in the interface
# directory; a cloned repository already has its own directory and the pane
# reaches its modules inside it (`require("thurbox-code-review.lib.diff")`).
#
# Nothing is fetched or built at install time, and ONE capability is asked for:
# `run`, and only for the two review targets the kernel does not compute — the
# uncommitted working changes of a session that has a base branch, and a single
# commit. Everything else comes from `thurbox.diffs`, which the kernel computes on
# a worker. Because the review is a tab of the agent pane, the grant is made to
# the agent pane's file.
#
# Untrusted, the review works: `run` is absent, the kernel's diff draws, and `t`
# names the choices it cannot serve rather than hiding them. See the README.
name = "code-review"
description = "thurbox's agent pane with a Review tab: a session's diff, reviewable beside its terminal"
version = "v0.3.0"

# The agent pane is vendored from thurbox v2.35.2, and CI tests v2.35.2. v2.35 is
# the floor for its LOOK: that release's focus language (a thick, marked frame on
# the focused pane) needs `lib/chrome` names and a `thick` border that do not
# exist before it. This is advisory — thurbox records it and does not enforce it
# — so below v2.35 the pane still loads and draws, in the rounded, unmarked frame
# the older release's own panes have (`lib/chrome.lua`); it has been tested back
# to v2.25.0. The review needs `store.selected`-driven diffs with `base_branch` on
# the session row, a file list built independently of the capped body, frame
# overlays, and `run` with `thurbox.runs`.
requires_thurbox = ">=2.35.0"

pane = { source = "plugins/20_agent.lua", path = "plugins/20_agent.lua" }
